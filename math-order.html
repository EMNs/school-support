<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordering Numbers</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f4f8; padding: 20px; max-width: 650px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .q-block { margin: 18px 0; font-size: 16px; }
        .q-block label { display: block; margin-bottom: 8px; font-weight: 500; }
        input { width: 100%; padding: 8px; font-size: 16px; border: 2px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; font-size: 18px; border-radius: 6px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        .back { text-decoration: none; color: #e74c3c; font-weight: bold; }
        .correct { border-color: #2ecc71; background: #e8f8f5; }
        .incorrect { border-color: #e74c3c; background: #fadbd8; }
        #score { margin-top: 15px; font-weight: bold; text-align: center; font-size: 20px; }
    </style>
</head>
<body>
    <a href="index.html" class="back">← Back to Menu</a>
    <div class="card" style="margin-top: 15px;">
        <h2>Ordering Numbers</h2>
        <p><em>Separate numbers with hyphens or commas (e.g., 100-200-300)</em></p>

        <div class="q-block">
            <label>a) <strong>Ascending order:</strong> 456,321 / 456,123 / 465,123 / 405,999</label>
            <input data-ans="405999-456123-456321-465123|405,999-456,123-456,321-465,123">
        </div>
        <div class="q-block">
            <label>b) <strong>Descending order:</strong> 78,900 / 87,090 / 78,099 / 87,900</label>
            <input data-ans="87900-87090-78900-78099|87,900-87,090-78,900-78,099">
        </div>
        <div class="q-block">
            <label>c) <strong>Ascending order:</strong> 600,006 / 606,000 / 660,000 / 600,600</label>
            <input data-ans="600006-600600-606000-660000|600,006-600,600-606,000-660,000">
        </div>
        <div class="q-block">
            <label>d) <strong>Ascending order:</strong> 112,300 / 121,300 / 101,300 / 111,300</label>
            <input data-ans="101300-111300-112300-121300|101,300-111,300-112,300-121,300">
        </div>
        <div class="q-block">
            <label>e) <strong>Descending order:</strong> 540,900 / 504,900 / 549,000 / 509,400</label>
            <input data-ans="549000-540900-509400-504900|549,000-540,900-509,400-504,900">
        </div>

        <button class="btn" onclick="check()">Check Answers</button>
        <div id="score"></div>
    </div>

    <script>
        function check() {
            let inputs = document.querySelectorAll('input');
            let score = 0;
            inputs.forEach(i => {
                let userAns = i.value.trim().toLowerCase().replace(/\s+/g, ' ').replace(/[\/,\s]+/g, '-').replace(/-+/g, '-');
                let validAnswers = i.getAttribute('data-ans').toLowerCase().split('|').map(ans => 
                    ans.trim().replace(/\s+/g, ' ').replace(/[\/,\s]+/g, '-').replace(/-+/g, '-')
                );

                if (userAns !== '' && validAnswers.includes(userAns)) {
                    i.className = 'correct'; score++;
                } else { i.className = 'incorrect'; }
            });
            document.getElementById('score').innerText = `Score: ${score} / ${inputs.length}`;
        }
    </script>
</body>
</html>
