<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined Operations</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f4f8; padding: 20px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .q-row { font-size: 18px; margin: 12px 0; display: flex; align-items: center; justify-content: space-between; }
        input { width: 70px; padding: 6px; text-align: center; font-size: 18px; border: 2px solid #ccc; border-radius: 4px; }
        .btn { width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; font-size: 18px; border-radius: 6px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        .back { text-decoration: none; color: #e74c3c; font-weight: bold; }
        .correct { border-color: #2ecc71; background: #e8f8f5; }
        .incorrect { border-color: #e74c3c; background: #fadbd8; }
        #score { margin-top: 15px; font-weight: bold; text-align: center; font-size: 20px; }
    </style>
</head>
<body>
    <a href="index.html" class="back">← Back to Menu</a>
    <div class="card" style="margin-top: 15px;">
        <h2>Combined Operations</h2>

        <div class="q-row"><span>a) 8 + 4 × 6 =</span> <input data-ans="32"></div>
        <div class="q-row"><span>b) (8 + 4) × 6 =</span> <input data-ans="72"></div>
        <div class="q-row"><span>c) 45 - 5 × 7 =</span> <input data-ans="10"></div>
        <div class="q-row"><span>d) 36 ÷ 4 + 9 =</span> <input data-ans="18"></div>
        <div class="q-row"><span>e) 7 × (15 - 9) =</span> <input data-ans="42"></div>
        <div class="q-row"><span>f) 64 ÷ 8 × 3 =</span> <input data-ans="24"></div>
        <div class="q-row"><span>g) 100 - (24 + 16) ÷ 5 =</span> <input data-ans="92"></div>
        <div class="q-row"><span>h) 6 × 7 + 18 ÷ 3 =</span> <input data-ans="48"></div>

        <button class="btn" onclick="check()">Check Answers</button>
        <div id="score"></div>
    </div>

    <script>
        function check() {
            let inputs = document.querySelectorAll('input');
            let score = 0;
            inputs.forEach(i => {
                if (i.value.trim() === i.getAttribute('data-ans')) {
                    i.className = 'correct'; score++;
                } else { i.className = 'incorrect'; }
            });
            document.getElementById('score').innerText = `Score: ${score} / ${inputs.length}`;
        }
    </script>
</body>
</html>
