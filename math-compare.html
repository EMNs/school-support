<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Numbers</title>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; padding: 20px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .q-row { font-size: 18px; margin: 12px 0; display: flex; align-items: center; gap: 10px; }
        input { width: 50px; padding: 6px; text-align: center; font-size: 18px; border: 2px solid #ccc; border-radius: 4px; }
        .btn { width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; font-size: 18px; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        .back { text-decoration: none; color: #e74c3c; font-weight: bold; }
        .correct { border-color: #2ecc71; background: #e8f8f5; }
        .incorrect { border-color: #e74c3c; background: #fadbd8; }
        #score { margin-top: 15px; font-weight: bold; text-align: center; font-size: 20px; }
    </style>
</head>
<body>
    <a href="index.html" class="back">← Back to Menu</a>
    <div class="card" style="margin-top: 15px;">
        <h2>1. Compare the Numbers (&lt;, &gt;, =)</h2>
        <div class="q-row">a) 456,782 <input data-ans=">"> 456,728</div>
        <div class="q-row">b) 90,105 <input data-ans="<"> 91,005</div>
        <div class="q-row">c) 700,009 <input data-ans=">"> 699,999</div>
        <div class="q-row">d) 305,640 <input data-ans="<"> 350,640</div>
        <div class="q-row">e) 82,450 <input data-ans=">"> 82,405</div>
        <div class="q-row">f) 999,999 <input data-ans="<"> 1,000,000</div>
        <div class="q-row">g) 123,456 <input data-ans="<"> 123,546</div>
        <div class="q-row">h) 508,012 <input data-ans="<"> 508,021</div>
        <div class="q-row">i) 674,890 <input data-ans="="> 674,890</div>
        <div class="q-row">j) 800,000 <input data-ans=">"> 799,999</div>

        <button class="btn" onclick="check()">Check Answers</button>
        <div id="score"></div>
    </div>

    <script>
        function check() {
            let inputs = document.querySelectorAll('input');
            let score = 0;
            inputs.forEach(i => {
                if (i.value.trim() === i.getAttribute('data-ans')) {
                    i.className = 'correct'; score++;
                } else { i.className = 'incorrect'; }
            });
            document.getElementById('score').innerText = `Score: ${score} / ${inputs.length}`;
        }
    </script>
</body>
</html>
