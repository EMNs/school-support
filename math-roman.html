<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roman & Ordinals</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f4f8; padding: 20px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .q-row { font-size: 16px; margin: 12px 0; display: flex; align-items: center; justify-content: space-between; }
        input { width: 130px; padding: 6px; text-align: center; font-size: 16px; border: 2px solid #ccc; border-radius: 4px; }
        .btn { width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; font-size: 18px; border-radius: 6px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        .back { text-decoration: none; color: #e74c3c; font-weight: bold; }
        .correct { border-color: #2ecc71; background: #e8f8f5; }
        .incorrect { border-color: #e74c3c; background: #fadbd8; }
        #score { margin-top: 15px; font-weight: bold; text-align: center; font-size: 20px; }
    </style>
</head>
<body>
    <a href="index.html" class="back">← Back to Menu</a>
    <div class="card" style="margin-top: 15px;">
        <h2>Roman & Ordinal Numbers</h2>

        <h3>A. Ordinal Numbers (in words)</h3>
        <div class="q-row"><span>a) 1st:</span> <input data-ans="first"></div>
        <div class="q-row"><span>b) 12th:</span> <input data-ans="twelfth"></div>
        <div class="q-row"><span>c) 23rd:</span> <input data-ans="twenty-third|twenty third"></div>
        <div class="q-row"><span>d) 5th:</span> <input data-ans="fifth"></div>

        <h3>B. Roman Numerals to Digits & Vice Versa</h3>
        <div class="q-row"><span>e) 14 in Roman:</span> <input data-ans="xiv"></div>
        <div class="q-row"><span>f) 29 in Roman:</span> <input data-ans="xxix"></div>
        <div class="q-row"><span>g) 48 in Roman:</span> <input data-ans="xlviii"></div>
        <div class="q-row"><span>h) XIX in figures:</span> <input data-ans="19"></div>
        <div class="q-row"><span>i) XLIV in figures:</span> <input data-ans="44"></div>
        <div class="q-row"><span>j) LXVIII in figures:</span> <input data-ans="68"></div>

        <button class="btn" onclick="check()">Check Answers</button>
        <div id="score"></div>
    </div>

    <script>
        function check() {
            let inputs = document.querySelectorAll('input');
            let score = 0;
            inputs.forEach(i => {
                let userAns = i.value.trim().toLowerCase();
                let validAnswers = i.getAttribute('data-ans').toLowerCase().split('|').map(ans => ans.trim());

                if (userAns !== '' && validAnswers.includes(userAns)) {
                    i.className = 'correct'; score++;
                } else { i.className = 'incorrect'; }
            });
            document.getElementById('score').innerText = `Score: ${score} / ${inputs.length}`;
        }
    </script>
</body>
</html>
