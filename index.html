<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Support - Portal</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        p.subtitle {
            color: #6b7280;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        /* Dashboard Menu Styles */
        .module-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .module-card {
            border: 2px solid #e5e7eb;
            border-radius: 0.75rem;
            padding: 1.25rem;
            text-align: left;
            transition: all 0.2s ease;
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .module-card:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1);
        }

        .module-info h3 {
            margin: 0 0 0.25rem 0;
            font-size: 1.1rem;
            color: var(--text-color);
        }

        .module-info p {
            margin: 0;
            font-size: 0.85rem;
            color: #6b7280;
        }

        .module-action-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 0.5rem;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>School Support Portal</h1>
        <p class="subtitle">Select a tool or activity to get started.</p>
        
        <div class="module-grid">
            <!-- Linked to multiplication_tables.html -->
            <a href="multiplication_tables.html" class="module-card">
                <div class="module-info">
                    <h3>Multiplication Practice</h3>
                    <p>Tables 2 to 9 • Sets of 10 questions</p>
                </div>
                <span class="module-action-btn">Play</span>
            </a>
            
            <!-- Future modules can be added here -->
        </div>
    </div>

</body>
</html>
