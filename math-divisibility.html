<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divisibility Rules</title>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; padding: 20px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .q-row { font-size: 16px; margin: 12px 0; display: flex; align-items: center; justify-content: space-between; }
        input { width: 70px; padding: 6px; text-align: center; font-size: 16px; border: 2px solid #ccc; border-radius: 4px; }
        .btn { width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; font-size: 18px; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        .back { text-decoration: none; color: #e74c3c; font-weight: bold; }
        .correct { border-color: #2ecc71; background: #e8f8f5; }
        .incorrect { border-color: #e74c3c; background: #fadbd8; }
        #score { margin-top: 15px; font-weight: bold; text-align: center; font-size: 20px; }
    </style>
</head>
<body>
    <a href="index.html" class="back">← Back to Menu</a>
    <div class="card" style="margin-top: 15px;">
        <h2>Multiples & Divisibility (yes / no)</h2>
        <div class="q-row"><span>a) Is 246 a multiple of 2?</span> <input data-ans="yes"></div>
        <div class="q-row"><span>b) Is 735 a multiple of 5?</span> <input data-ans="yes"></div>
        <div class="q-row"><span>c) Is 918 a multiple of 3?</span> <input data-ans="yes"></div>
        <div class="q-row"><span>d) Is 1,024 a multiple of 10?</span> <input data-ans="no"></div>
        <div class="q-row"><span>e) Is 4,125 a multiple of 9?</span> <input data-ans="no"></div>
        <div class="q-row"><span>f) Is 972 a multiple of 6?</span> <input data-ans="yes"></div>
        <div class="q-row"><span>g) Is 514 a multiple of 2?</span> <input data-ans="yes"></div>
        <div class="q-row"><span>h) Is 890 a multiple of 5?</span> <input data-ans="yes"></div>

        <button class="btn" onclick="check()">Check Answers</button>
        <div id="score"></div>
    </div>

    <script>
        function check() {
            let inputs = document.querySelectorAll('input');
            let score = 0;
            inputs.forEach(i => {
                if (i.value.trim().toLowerCase() === i.getAttribute('data-ans')) {
                    i.className = 'correct'; score++;
                } else { i.className = 'incorrect'; }
            });
            document.getElementById('score').innerText = `Score: ${score} / ${inputs.length}`;
        }
    </script>
</body>
</html>
