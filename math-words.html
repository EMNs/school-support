<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Words and Digits</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f4f8; padding: 20px; max-width: 650px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .q-block { margin: 18px 0; font-size: 16px; }
        .q-block label { display: block; margin-bottom: 8px; font-weight: 500; }
        input { width: 100%; padding: 8px; font-size: 16px; border: 2px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; font-size: 18px; border-radius: 6px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        .back { text-decoration: none; color: #e74c3c; font-weight: bold; }
        .correct { border-color: #2ecc71; background: #e8f8f5; }
        .incorrect { border-color: #e74c3c; background: #fadbd8; }
        #score { margin-top: 15px; font-weight: bold; text-align: center; font-size: 20px; }
    </style>
</head>
<body>
    <a href="index.html" class="back">← Back to Menu</a>
    <div class="card" style="margin-top: 15px;">
        <h2>Words & Digits</h2>

        <h3>A. Write in Words</h3>
        <div class="q-block">
            <label>a) 42,518</label>
            <input data-ans="forty-two thousand five hundred and eighteen|forty two thousand five hundred and eighteen|forty-two thousand five hundred eighteen|forty two thousand five hundred eighteen">
        </div>
        <div class="q-block">
            <label>b) 306,074</label>
            <input data-ans="three hundred and six thousand and seventy-four|three hundred and six thousand and seventy four|three hundred six thousand seventy-four|three hundred six thousand seventy four">
        </div>
        <div class="q-block">
            <label>c) 15,204</label>
            <input data-ans="fifteen thousand two hundred and four|fifteen thousand two hundred four">
        </div>

        <h3>B. Write in Digits</h3>
        <div class="q-block">
            <label>d) Two hundred and thirty-four thousand, six hundred and nine:</label>
            <input data-ans="234609|234,609">
        </div>
        <div class="q-block">
            <label>e) Five hundred thousand and forty-two:</label>
            <input data-ans="500042|500,042">
        </div>
        <div class="q-block">
            <label>f) Seventy-five thousand, two hundred and thirty:</label>
            <input data-ans="75230|75,230">
        </div>

        <button class="btn" onclick="check()">Check Answers</button>
        <div id="score"></div>
    </div>

    <script>
        function check() {
            let inputs = document.querySelectorAll('input');
            let score = 0;
            inputs.forEach(i => {
                let userAns = i.value.trim().toLowerCase().replace(/\s+/g, ' ');
                let validAnswers = i.getAttribute('data-ans').toLowerCase().split('|').map(ans => ans.trim());

                if (userAns !== '' && validAnswers.includes(userAns)) {
                    i.className = 'correct'; score++;
                } else { i.className = 'incorrect'; }
            });
            document.getElementById('score').innerText = `Score: ${score} / ${inputs.length}`;
        }
    </script>
</body>
</html>
